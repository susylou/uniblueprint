<nav class="au-topbar" role="navigation" aria-label="Primary">
  <a class="au-logo" href="?id=home" aria-label="Aotearoa University home">
    <span class="au-logomark" aria-hidden="true">A</span>
    <span class="au-wordmark">
      Aotearoa University
      <span class="au-wordmark-reo">Te Whare Wānanga o Aotearoa <em>[Te Reo TBC]</em></span>
    </span>
  </a>

  <ul class="au-nav" ng-if="c.data.menu &amp;&amp; c.data.menu.items">
    <li ng-repeat="item in c.data.menu.items track by item.sys_id"
        ng-class="{ 'is-active': c.isActive(item) }">
      <a ng-href="{{c.itemHref(item)}}"
         ng-attr-target="{{item.url_target || undefined}}">
        <span class="au-nav-en">{{item.label}}</span>
        <span class="au-nav-reo" ng-if="item.hint">{{item.hint}}</span>
      </a>
    </li>
  </ul>

  <div class="au-top-actions">
    <div class="au-lang-toggle" role="group" aria-label="Language">
      <button type="button"
              class="au-lang-opt"
              ng-class="{ 'on': c.lang === 'en' }"
              ng-click="c.setLang('en')">En</button>
      <button type="button"
              class="au-lang-opt"
              ng-class="{ 'on': c.lang === 'reo' }"
              ng-click="c.setLang('reo')">Reo</button>
    </div>
    <div class="au-avatar" aria-label="Your profile">{{c.data.userInitials}}</div>
  </div>
</nav>
