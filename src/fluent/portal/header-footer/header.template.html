<nav class="au-topbar" role="navigation" aria-label="Primary">
  <a class="au-logo" href="?id=au-home" aria-label="Aotearoa University home">
    <span class="au-logomark" aria-hidden="true">A</span>
    <span class="au-wordmark">
      Aotearoa University
      <span class="au-wordmark-reo">Te Whare Wānanga o Aotearoa <em>[Te Reo TBC]</em></span>
    </span>
  </a>

  <ul class="au-nav" ng-if="data.menu &amp;&amp; data.menu.items">
    <li ng-repeat="item in data.menu.items track by $index"
        ng-class="{ 'is-active': item.isActive }">
      <a ng-href="{{item.href}}"
         ng-attr-target="{{item.url_target || undefined}}">
        <span class="au-nav-en">{{item.label}}</span>
        <span class="au-nav-reo" ng-if="item.hint">{{item.hint}}</span>
      </a>
    </li>
  </ul>

  <div class="au-top-actions">
    <div class="au-lang-toggle" role="group" aria-label="Language">
      <button type="button" class="au-lang-opt on">En</button>
      <button type="button" class="au-lang-opt">Reo</button>
    </div>
    <div class="au-avatar" aria-label="Your profile">{{data.userInitials}}</div>
  </div>
</nav>
